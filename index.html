<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Professional Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SECTION -->
<section id="loginSection" class="login">
  <div class="login-container">
    <h1>Welcome</h1>
    <p class="login-subtext">Enter your details to access the portfolio</p>

    <input type="text" id="loginName" placeholder="Name">
    <input type="number" id="loginAge" placeholder="Age">
    <input type="date" id="loginDob">

    <button id="loginBtn">Login</button>
    <p id="loginMsg"></p>
  </div>
</section>

<!-- QUIZ SECTION -->
<section id="quizSection" class="quiz" style="display:none;">
  <div class="quiz-container">
    <h2 id="question"></h2>

    <div id="options">
      <button class="option-btn"></button>
      <button class="option-btn"></button>
      <button class="option-btn"></button>
      <button class="option-btn"></button>
    </div>

    <button id="nextBtn" style="display:none;">Next</button>

    <p id="progress"></p>
  </div>
</section>

<!-- RESULT SECTION -->
<section id="resultSection" class="quiz" style="display:none;">
  <div class="quiz-container">
    <h2>Your Result</h2>
    <p id="scoreText"></p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
