<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="projects">
    <h2>My Coding Projects</h2>
    <div class="project-images">
        <img src="images/code1.png" alt="Code Project 1">
        <img src="images/code2.png" alt="Code Project 2">
    </div>
</section>

<header>
    <h1>Welcome to My Website</h1>
    <p>Click the button below to see a magic message!</p>
    <button id="magicBtn" class="btn">Show Message</button>
    <p id="magicMsg" class="magic-msg"></p>
</header>

<section class="about">
    <h2>About Me</h2>
    <p>Hello! I am learning web development and JavaScript. This website has interactive elements!</p>
</section>

<section class="skills">
    <h2>Skills</h2>
    <div class="skill-box">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
    </div>
</section>

<section class="contact">
    <h2>Contact</h2>
    <input type="text" id="userName" placeholder="Enter your name">
    <button id="greetBtn" class="btn">Greet Me</button>
    <p id="greetMsg" class="magic-msg"></p>
</section>

<footer>
    <p>© 2026 Interactive Website. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
