<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Professional Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<section id="loginSection">
  <div class="card">

    <h1>Login Portal</h1>

    <!-- ADMIN LOGIN -->
    <h3>Admin Login</h3>
    <input id="adminUser" placeholder="Admin Username">
    <input id="adminPass" type="password" placeholder="Admin Password">
    <button id="adminLoginBtn">Admin Login</button>
    <p id="adminMsg"></p>

    <hr>

    <!-- USER LOGIN -->
    <h3>User Login</h3>
    <p class="login-subtext">Enter your details to access the portfolio</p>

    <input id="loginName" placeholder="Name">
    <input id="loginAge" type="number" placeholder="Age">
    <input id="loginDob" type="date">
    <button id="userLoginBtn">User Login</button>
    <p id="loginMsg"></p>

  </div>
</section>

<!-- QUIZ PAGE -->
<section id="quizSection" style="display:none;">
  <div class="card">
    <h2 id="question"></h2>

    <button class="option"></button>
    <button class="option"></button>
    <button class="option"></button>
    <button class="option"></button>

    <button id="nextBtn" style="display:none;">Next</button>
    <p id="progress"></p>
  </div>
</section>

<!-- HOME PAGE -->
<section id="homeSection" style="display:none;">
  <div class="card">

    <h2>🎩 Magic Button</h2>
    <button id="magicBtn">Click Me</button>
    <p id="magicMsg"></p>

    <h2>🖼️ My Projects</h2>
    <div class="projects">
      <img src="code1.png">
      <img src="code2.png">
    </div>

    <h2>👋 Greeting</h2>
    <input id="greetInput" placeholder="Enter your name">
    <button id="greetBtn">Greet Me</button>
    <p id="greetMsg"></p>

  </div>
</section>

<script src="script.js"></script>
</body>
</html>
